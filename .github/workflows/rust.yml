name: RocksDB CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: make clippy

  valgrind:
    name: valgrind
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - run: sudo apt-get update && sudo apt-get install -y valgrind libclang-dev jq
      - run: make -C librocksdb-sys test

  test:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: Linux
            os: ubuntu-22.04
            features: jemalloc,io-uring
            native-features: true
          - build: Linux (portable)
            os: ubuntu-22.04
            features: portable,snappy,lz4,serde1
            args: --no-default-features
          - build: Linux (march-native)
            os: ubuntu-22.04
            features: march-native,jemalloc,io-uring
          - build: macOS
            os: macos-latest
            features: portable,jemalloc,io-uring,serde1
          - build: windows-2022
            os: windows-2022
            features: jemalloc,io-uring
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev strace jq
      - name: Build test binaries
        shell: bash
        run: cargo test --locked --workspace ${{ matrix.args }} --features '${{ matrix.features }}' --no-run --message-format=json > native-build.json
      - name: Run tests
        run: cargo test --locked --workspace ${{ matrix.args }} --features '${{ matrix.features }}'
      - name: Verify native linking and io-uring fallback
        if: matrix.native-features
        run: bash ci/test-native-features.sh native-build.json

  package:
    name: Publish dry run
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Verify both packaged crates, including Linux features
        run: cargo publish --locked --workspace --dry-run --features portable,jemalloc,io-uring
